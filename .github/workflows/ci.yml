name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Neuere Pushes auf demselben Ref brechen laufende Läufe ab
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm-Version kommt aus "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests laufen unter System-Node — better-sqlite3 gegen dessen ABI bauen
      # (postinstall baut zunächst gegen Electron).
      - name: Rebuild native module for Node
        run: npm rebuild better-sqlite3

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      # Vorerst nicht blockierend: hunspell-asm zieht ein veraltetes nanoid
      # (Advisory, kein kompatibler Fix). Auf blockierend stellen, sobald behoben.
      - name: Audit (prod, high)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (electron-vite)
        run: pnpm exec electron-vite build

      # Unsignierter Paketierungs-Test (prüft Fuses/asarUnpack-Konfiguration)
      - name: Package (unsigned)
        run: pnpm exec electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Kompiliert den Swift-Helper (Foundation Models + Spracherkennung), damit
  # Fehler im Swift-Code nicht erst beim Release auffallen. Das Binary braucht
  # macOS-26-SDK (Xcode 26); ältere Runner brechen --strict mit Fehler ab.
  swift-helper:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Swift helper
        run: pnpm build:fm

      - name: Smoke test helper
        run: |
          native/fm-helper/bin/noctua-fm stt-check en-US
          native/fm-helper/bin/noctua-fm check || true
